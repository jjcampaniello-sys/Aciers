<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metallurgical Analysis & Process Window</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#f8fafc; color:#0f172a; margin:0; padding:20px; }
  .wrap { max-width:1280px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 16px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:18px; margin-bottom:18px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; }
  label { display:block; font-size:12.5px; font-weight:600; margin-bottom:4px; color:#334155; }
  input, select, button { width:100%; padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:13.5px; box-sizing:border-box; }
  button { background:#2563eb; color:#fff; border:none; font-weight:600; cursor:pointer; margin-top:10px; }
  button:hover { background:#1d4ed8; }
  .hidden { display:none; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th, td { border:1px solid #e2e8f0; padding:7px 9px; text-align:left; }
  th { background:#f1f5f9; }
  .kpi-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .kpi { flex:1; min-width:140px; background:#f1f5f9; padding:10px 14px; border-radius:8px; }
  .kpi b { font-size:18px; display:block; }
  .box { background:#f8fafc; border-left:4px solid #16a34a; padding:12px; border-radius:6px; font-family:ui-monospace, monospace; font-size:13px; white-space:pre-line; line-height:1.5; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .tab { width:auto; background:#e2e8f0; color:#0f172a; margin:0; padding:7px 14px; }
  .tab.active { background:#0f172a; color:#fff; }
</style>
</head>
<body>
<div class="wrap">
<h1>Metallurgical Analysis &amp; Process Window</h1>

<div class="card">
  <h3>1. File &amp; Criteria</h3>
  <input type="file" id="fileInput" accept=".xlsm,.xlsx,.xls,.csv" />
  <div id="sheetControls" class="grid hidden" style="margin-top:12px">
    <div><label>Sheet:</label><select id="sheetSelect"></select></div>
    <div><label>Header row:</label><input type="number" id="headerRow" value="1" min="1" max="30"></div>
    <div><button onclick="parseSheet()">Load Columns</button></div>
  </div>
  <div class="grid" style="margin-top:12px">
    <div><label>Process route:</label>
      <select id="c_route" onchange="toggleRoute()">
        <option value="GALVA">Hot Rolling + Annealing / Galva</option>
        <option value="HSM">Hot Rolling only (stop at coiling CT)</option>
      </select>
    </div>
    <div><label>Steel family:</label>
      <select id="c_grade">
        <option value="HSLA">HSLA (Microalloyed Nb/Ti)</option>
        <option value="CMN">C-Mn / Mild Steel</option>
        <option value="AHSS">DP / AHSS (Multiphase)</option>
      </select>
    </div>
    <div><label>Test direction (fixed for analysis):</label>
      <select id="c_dir"><option value="L">L (Longitudinal)</option><option value="S">S (Transverse)</option><option value="D">D (Diagonal)</option></select></div>
    <div><label>YS / Rp min (MPa):</label><input type="number" id="c_rp" value="460"></div>
    <div><label>UTS / Rm max (MPa):</label><input type="number" id="c_rm" value="680"></div>
    <div><label>Elongation A min (%) (strict &gt;):</label><input type="number" id="c_a" value="15"></div>
    <div><label>Thin gauge if Th ≤ (mm):</label><input type="number" id="c_lo" step="0.05" value="1.0"></div>
    <div><label>Thick gauge if Th ≥ (mm):</label><input type="number" id="c_hi" step="0.05" value="1.4"></div>
    <div><label>CART: min coils / leaf:</label><input type="number" id="c_leaf" value="15"></div>
    <div><label>CART: max depth:</label><input type="number" id="c_depth" value="3"></div>
    <div><label>HSM low (blank = auto, P20 of regime):</label><input type="number" id="c_hlo" step="0.01"></div>
    <div><label>HSM high (blank = auto, P80 of regime):</label><input type="number" id="c_hhi" step="0.01"></div>
    <div><label><input type="checkbox" id="c_single" checked style="width:auto"> Single regime (thickness = feature)</label></div>
  </div>
</div>

<div id="mappingCard" class="card hidden">
  <h3>2. Column Mapping</h3>
  <div id="mappingGrid" class="grid"></div>
  <button onclick="runAnalysis()" style="max-width:260px">Run Analysis</button>
</div>

<div id="results" class="hidden">
  <div class="card">
    <h3>3. Rejects by Thickness Regime</h3>
    <div id="kpis" class="kpi-row"></div>
    <div id="regimeTable"></div>
  </div>

  <div class="card">
    <h3>4. CART Tree &amp; Operating Window</h3>
    <div class="tabs" id="regimeTabs"></div>
    <div class="grid" style="margin-bottom:10px">
      <div><label>X Axis:</label><select id="xSel" onchange="updateScatter()"></select></div>
      <div><label>Y Axis:</label><select id="ySel" onchange="updateScatter()"></select></div>
    </div>
    <div id="scatterPlot" style="height:440px"></div>
    <h4 style="margin:14px 0 6px">CART Rules</h4>
    <div id="rulesTable"></div>
  </div>

  <div class="card" style="border-left:5px solid #16a34a">
    <h3 id="simTitle">5. Simulator: Optimal Annealing Setpoint</h3>
    <p style="font-size:13.5px;color:#475569">Model calibrated on the entered coil's thickness regime with the selected test direction.</p>
    <label><strong>Load a coil from file:</strong></label>
    <select id="coilSel" onchange="fillFromCoil()" style="max-width:300px"><option value="">-- Manual entry --</option></select>
    <div class="grid" style="margin-top:10px">
      <div><label>Thickness Th (mm) *:</label><input type="number" id="s_Th" step="0.01" value="1.55"></div>
      <div id="grp_CR"><label>Cold Reduction %CR *:</label><input type="number" id="s_CR" step="0.1" value="56.5"></div>
      <div><label>Coiling Temp CT (°C) *:</label><input type="number" id="s_CT" value="555"></div>
      <div><label>ROT Speed:</label><input type="number" id="s_Vrot" step="0.1"></div>
      <div id="grp_V"><label>Annealing Line Speed (blank = optimized):</label><input type="number" id="s_V" step="1"></div>
      <div><label>C wt%:</label><input type="number" id="s_C" step="0.001"></div>
      <div><label>Mn wt%:</label><input type="number" id="s_Mn" step="0.01"></div>
      <div><label>Nb wt%:</label><input type="number" id="s_Nb" step="0.001"></div>
      <div><label>Ti wt%:</label><input type="number" id="s_Ti" step="0.001"></div>
      <div><label>N wt%:</label><input type="number" id="s_N" step="0.0001"></div>
      <div><label>Mother Coil Position (LENGTH_POS_MOTHER):</label><input type="number" id="s_Pos" step="1"></div>
      <div><label>Hot Rolling Temp (TEMP_START_F7):</label><input type="number" id="s_TF7" step="1"></div>
    </div>
    <button id="simBtn" onclick="simulate()" style="background:#16a34a">Calculate Setpoint</button>
    <div id="simOut" class="box" style="margin-top:15px;display:none"></div>
    <div id="simTab" style="margin-top:14px;overflow-x:auto"></div>
  </div>
</div>
</div>

<script>
const FIELDS = [
  {id:'Rp',label:'YS / Rp (MPa)',req:1},{id:'Rm',label:'UTS / Rm (MPa)',req:1},{id:'A',label:'Elongation A (%)'},
  {id:'Th',label:'Final Thickness (mm)',req:1},{id:'CR',label:'Cold Reduction %CR',req:1},{id:'CT',label:'Coiling Temp CT (°C)',req:1},
  {id:'T_recuit',label:'Annealing Temp (°C)',req:1},{id:'V_galva',label:'Annealing Line Speed',req:1},
  {id:'V_rot',label:'ROT Speed'},{id:'Nb',label:'Nb (wt%)'},{id:'Ti',label:'Ti (wt%)'},{id:'N',label:'N (wt%)'},
  {id:'C',label:'C (wt%)'},{id:'Mn',label:'Mn (wt%)'},{id:'Dir',label:'Test Direction'},{id:'CoilID',label:'Coil ID (ideally unique per coil)'},
  {id:'Pos',label:'Mother Coil Position (LENGTH_POS_MOTHER)'},{id:'TF7',label:'Hot Rolling Temp (TEMP_START_F7)'}
];
const ST = {OK:'Compliant', DOUX:'Soft Reject', DUR:'Hard Reject', DUCT:'Ductility Reject', MULT:'Multiple Reject'};
const COLORS = {[ST.OK]:'#16a34a',[ST.DOUX]:'#2563eb',[ST.DUR]:'#dc2626',[ST.DUCT]:'#d97706',[ST.MULT]:'#7c3aed'};
const REGS = ['Thin','Medium','Thick','All'];
let wb = null, raw = [], all = [], data = [], C = {}, curReg = 'Medium', curLeaves = [];

function toggleRoute() {
  const isHSM = $('c_route').value === 'HSM';
  ['CR', 'T_recuit', 'V_galva'].forEach(id => {
    const f = FIELDS.find(x => x.id === id);
    if (f) f.req = isHSM ? 0 : 1;
  });
  $('grp_CR').classList.toggle('hidden', isHSM);
  $('grp_V').classList.toggle('hidden', isHSM);
  $('simTitle').innerText = isHSM ? '5. Simulator: Hot-Rolled Properties Prediction' : '5. Simulator: Optimal Annealing Setpoint';
  $('simBtn').innerText = isHSM ? 'Predict Properties (Rp, Rm, A)' : 'Calculate Setpoint';
  if (wb) parseSheet();
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const regime = th => C.single ? 'All' : (th <= C.lo ? 'Thin' : th >= C.hi ? 'Thick' : 'Medium');
const quant = (a, q) => { const s = [...a].sort((x,y) => x-y), i = (s.length-1)*q, l = Math.floor(i); return l === i ? s[l] : s[l] + (s[l+1]-s[l])*(i-l); };

$('fileInput').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
    $('sheetSelect').innerHTML = wb.SheetNames.map(n => `<option>${esc(n)}</option>`).join('');
    $('sheetControls').classList.remove('hidden');
    parseSheet();
  };
  r.readAsArrayBuffer(file);
};

function parseSheet() {
  if (!wb) return;
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[$('sheetSelect').value], {header:1, defval:''});
  const hi = parseInt($('headerRow').value, 10) - 1;
  if (rows.length <= hi) return alert('Invalid header row.');
  const headers = rows[hi].map((h,i) => h ? String(h).trim() : `Col_${i+1}`);
  raw = rows.slice(hi+1).map(r => { const o = {}; headers.forEach((h,i) => o[h] = r[i]); return o; });
  $('mappingGrid').innerHTML = FIELDS.map(f => `<div><label>${f.label}${f.req ? ' *' : ''}</label><select id="map_${f.id}"><option value="">(Ignore)</option>${headers.map(h => `<option value="${esc(h)}">${esc(h)}</option>`).join('')}</select></div>`).join('');
  try {
    const sv = JSON.parse(localStorage.getItem('hsla_mapping') || '{}');
    FIELDS.forEach(f => { if (sv[f.id] && headers.includes(sv[f.id])) $('map_'+f.id).value = sv[f.id]; });
  } catch(e) {}
  $('mappingCard').classList.remove('hidden');
}

function runAnalysis() {
for (const f of FIELDS.filter(x => x.req)) if (!$('map_'+f.id).value) return alert('Required column: ' + f.label);
try { const m = {}; FIELDS.forEach(f => m[f.id] = $('map_'+f.id).value); localStorage.setItem('hsla_mapping', JSON.stringify(m)); } catch(e) {}
C = {
rp:+$('c_rp').value, rm:+$('c_rm').value, a:+$('c_a').value, lo:+$('c_lo').value, hi:+$('c_hi').value,
dir:$('c_dir').value, leaf:Math.max(5,+$('c_leaf').value||15), depth:+$('c_depth').value||3,
hlo:parseFloat($('c_hlo').value), hhi:parseFloat($('c_hhi').value), single:$('c_single').checked,
route:$('c_route').value, grade:$('c_grade').value
};
const reqIds = C.route === 'HSM' ? ['Rp','Rm','Th','CT'] : ['Rp','Rm','Th','CR','CT','T_recuit','V_galva'];
const dirMapped = !!$('map_Dir').value;
all = [];
raw.forEach(row => {
const it = {};
FIELDS.forEach(f => {
const col = $('map_'+f.id).value;
if (f.id === 'Dir') it.Dir = col ? String(row[col]).trim().toUpperCase() : '';
else if (f.id === 'CoilID') it.CoilID = col ? String(row[col]).trim() : '';
else it[f.id] = col ? parseFloat(String(row[col]).replace(',', '.')) : NaN;
});
if (reqIds.some(id => isNaN(it[id]))) return;
if (dirMapped && it.Dir !== C.dir) return;
const doux = it.Rp < C.rp, dur = it.Rm > C.rm, duct = !isNaN(it.A) && it.A <= C.a;
const n = doux + dur + duct;
it.Statut = n > 1 ? ST.MULT : doux ? ST.DOUX : dur ? ST.DUR : duct ? ST.DUCT : ST.OK;
if (![it.Nb,it.N,it.Ti].some(isNaN)) it.Nb_eff = it.Nb - Math.max(0, 6.64 * (it.N - 0.292 * it.Ti));
if (![it.C,it.Mn].some(isNaN)) it.C_eq = it.C + it.Mn / 6;
if (!isNaN(it.V_rot) && it.CT > 400) it.Potentiel_HSM = it.V_rot / (it.CT - 400);
it.Regime = regime(it.Th);
all.push(it);
});
data = all;
C.hasA = data.some(d => !isNaN(d.A));
if (!data.length) return alert('No valid rows found for this direction and route.');
render();
}
function render() {
  $('results').classList.remove('hidden');
  const tot = data.length, cnt = st => data.filter(d => d.Statut === st).length, pct = n => tot ? (100*n/tot).toFixed(1) : '0.0';
  const rej = tot - cnt(ST.OK);
  $('kpis').innerHTML = [
    ['Overall Reject', `${rej}/${tot} (${pct(rej)}%)`], ['Soft', `${cnt(ST.DOUX)} (${pct(cnt(ST.DOUX))}%)`],
    ['Hard', `${cnt(ST.DUR)} (${pct(cnt(ST.DUR))}%)`], ['Ductility', `${cnt(ST.DUCT)} (${pct(cnt(ST.DUCT))}%)`],
    ['Multiple', `${cnt(ST.MULT)} (${pct(cnt(ST.MULT))}%)`], ['Coils', tot]
  ].map(([k,v]) => `<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join('');

  $('regimeTable').innerHTML = `<table><tr><th>Regime</th><th>Coils</th><th>Compliant</th><th>Soft</th><th>Hard</th><th>Ductility</th><th>Multiple</th><th>% Reject</th></tr>` +
    REGS.map(r => {
      const sub = r === 'All' ? data : data.filter(d => d.Regime === r), n = sub.length;
      if (!n) return `<tr><td>${r}</td><td colspan="7">0 coils</td></tr>`;
      const ok = sub.filter(d => d.Statut === ST.OK).length;
      return `<tr><td><b>${r}</b></td><td>${n}</td><td>${ok}</td><td>${sub.filter(d=>d.Statut===ST.DOUX).length}</td><td>${sub.filter(d=>d.Statut===ST.DUR).length}</td><td>${sub.filter(d=>d.Statut===ST.DUCT).length}</td><td>${sub.filter(d=>d.Statut===ST.MULT).length}</td><td><b>${(100*(n-ok)/n).toFixed(1)}%</b></td></tr>`;
    }).join('') + `</table>`;

  const nc = (C.route === 'HSM'
    ? ['CT','V_rot','Potentiel_HSM','Th','Nb_eff','C_eq','Pos','TF7','A']
    : ['T_recuit','V_galva','CT','V_rot','Potentiel_HSM','CR','Th','Nb_eff','C_eq','Pos','TF7','A']
  ).filter(k => data.some(d => !isNaN(d[k])));
  ['xSel','ySel'].forEach((id, idx) => { $(id).innerHTML = nc.map(k => `<option>${k}</option>`).join(''); $(id).selectedIndex = Math.min(idx, nc.length-1); });

  $('coilSel').innerHTML = `<option value="">-- Manual entry --</option>` + data.map((d,i) => `<option value="${i}">${esc(d.CoilID || 'Coil '+(i+1))} | Th=${d.Th} | ${d.Statut}</option>`).join('');
  const bestReg = C.single ? 'All' : REGS.slice(0,3).sort((a,b) => data.filter(d=>d.Regime===b).length - data.filter(d=>d.Regime===a).length)[0];
  $('regimeTabs').innerHTML = (C.single ? ['All'] : REGS).map(r => `<button class="tab ${r===bestReg?'active':''}" onclick="selectReg('${r}',this)">${r}</button>`).join('');
  curReg = bestReg;
  updateRegime();
}

function selectReg(r, btn) { curReg = r; document.querySelectorAll('.tab').forEach(b => b.classList.remove('active')); btn.classList.add('active'); updateRegime(); }

function updateRegime() {
  const rows = curReg === 'All' ? data : data.filter(d => d.Regime === curReg);
  const cand = C.route === 'HSM'
    ? ['CT','V_rot','Potentiel_HSM','Th','Nb_eff','C_eq','TF7']
    : ['T_recuit','V_galva','CT','V_rot','Potentiel_HSM','CR','Th','Nb_eff','C_eq','TF7'];
  const feats = cand.filter(k => rows.filter(d => !isNaN(d[k])).length >= 0.8 * rows.length);
  curLeaves = [];
  if (rows.length >= C.leaf && feats.length) buildTree(rows, feats, 0, []);
  const tot = rows.length || 1;
  $('rulesTable').innerHTML = curLeaves.length ? `<table><tr><th>CART Rule</th><th>Coils</th><th>%</th><th>Main Status</th><th>% Compliant</th><th>% Soft</th><th>% Hard</th></tr>` +
    curLeaves.sort((a,b) => b.n - a.n).map(l => `<tr><td>${l.rule || 'All'}</td><td>${l.n}</td><td>${(100*l.n/tot).toFixed(1)}%</td><td><b>${l.top}</b></td><td>${l.pOK}%</td><td>${l.pDoux}%</td><td>${l.pDur}%</td></tr>`).join('') + `</table>` : '<p>Insufficient data for CART.</p>';
  updateScatter();
}

function gini(rows) {
  const n = rows.length; if (!n) return 0;
  let s = 0; Object.values(ST).forEach(st => { const p = rows.filter(r => r.Statut === st).length / n; s += p*p; });
  return 1 - s;
}

function buildTree(rows, feats, depth, conds) {
  const n = rows.length, counts = Object.values(ST).map(st => [st, rows.filter(r => r.Statut === st).length]).sort((a,b) => b[1]-a[1]);
  const pure = counts[0][1]/n >= 0.90;
  let best = {gain:0};
  if (depth < C.depth && !pure && n >= 2 * C.leaf) {
    const g0 = gini(rows);
    feats.forEach(f => {
      const vals = [...new Set(rows.map(r => r[f]).filter(v => !isNaN(v)))].sort((a,b) => a-b);
      for (let i = 0; i < vals.length - 1; i++) {
        const thr = (vals[i] + vals[i+1]) / 2;
        const L = rows.filter(r => r[f] <= thr), R = rows.filter(r => r[f] > thr);
        if (L.length < C.leaf || R.length < C.leaf) continue;
        const gain = g0 - (L.length/n)*gini(L) - (R.length/n)*gini(R);
        if (gain > best.gain) best = {gain, f, thr, L, R};
      }
    });
  }
  if (best.gain > 0.005) {
    buildTree(best.L, feats, depth+1, [...conds, `${best.f} ≤ ${best.thr.toFixed(2)}`]);
    buildTree(best.R, feats, depth+1, [...conds, `${best.f} > ${best.thr.toFixed(2)}`]);
  } else {
    curLeaves.push({rule:conds.join(' AND '), n, top:counts[0][0],
      pOK:(100*rows.filter(r=>r.Statut===ST.OK).length/n).toFixed(0),
      pDoux:(100*rows.filter(r=>r.Statut===ST.DOUX).length/n).toFixed(0),
      pDur:(100*rows.filter(r=>r.Statut===ST.DUR).length/n).toFixed(0)});
  }
}

function updateScatter() {
  const xk = $('xSel').value, yk = $('ySel').value;
  const rows = (curReg === 'All' ? data : data.filter(d => d.Regime === curReg)).filter(d => !isNaN(d[xk]) && !isNaN(d[yk]));
  const traces = Object.values(ST).map(st => {
    const p = rows.filter(d => d.Statut === st);
    return {x:p.map(d=>d[xk]), y:p.map(d=>d[yk]), mode:'markers', type:'scatter', name:`${st} (${p.length})`,
      marker:{color:COLORS[st], size:8, opacity:0.85},
      text:p.map(d => `${d.CoilID ? 'Coil '+d.CoilID+'<br>' : ''}Rp ${d.Rp} | Rm ${d.Rm}${isNaN(d.A) ? '' : ' | A '+d.A+'%'}<br>Th ${d.Th} | CT ${d.CT}${C.route === 'HSM' ? '' : ` | CR ${d.CR} | T ${d.T_recuit} | V ${d.V_galva}`}`)};
  });
  Plotly.newPlot('scatterPlot', traces, {margin:{t:30,l:55,r:20,b:50}, xaxis:{title:xk}, yaxis:{title:yk}, hovermode:'closest'});
}

function fillFromCoil() {
const idx = $('coilSel').value; if (idx === '') return;
const d = data[+idx];
const set = (id, v) => $(id).value = isNaN(v) ? '' : v;
set('s_Th', d.Th); set('s_CR', d.CR); set('s_CT', d.CT); set('s_Vrot', d.V_rot); set('s_V', '');
set('s_C', d.C); set('s_Mn', d.Mn); set('s_Nb', d.Nb); set('s_Ti', d.Ti); set('s_N', d.N); set('s_Pos', d.Pos); set('s_TF7', d.TF7);
}
// --- Multivariate Ridge Calibration + Joint Conformity Simulation ---
function solve(A, b) {
const n = b.length, M = A.map((r,i) => [...r, b[i]]);
for (let i = 0; i < n; i++) {
let mx = i; for (let r = i+1; r < n; r++) if (Math.abs(M[r][i]) > Math.abs(M[mx][i])) mx = r;
[M[i], M[mx]] = [M[mx], M[i]]; if (Math.abs(M[i][i]) < 1e-12) return null;
for (let r = i+1; r < n; r++) { const f = M[r][i]/M[i][i]; for (let c = i; c <= n; c++) M[r][c] -= f*M[i][c]; }
}
const x = Array(n).fill(0);
for (let i = n-1; i >= 0; i--) { let s = M[i][n]; for (let c = i+1; c < n; c++) s -= M[i][c]*x[c]; x[i] = s/M[i][i]; }
return x;
}
function vec(r, f, q) {
  const v = f.map(c => r[c]);
  if (q) {
    if (f.includes('T_recuit')) { v.push(r.T_recuit**2); if (f.includes('CT')) v.push(r.T_recuit*r.CT); }
    else if (f.includes('CT')) { v.push(r.CT**2); if (f.includes('V_rot')) v.push(r.CT*r.V_rot); }
  }
  return v;
}

function fitModel(tr, f, q, yk, lam = 1e-2) {
  const X = tr.map(r => vec(r, f, q)), p = X[0].length, n = X.length;
  const mu = Array.from({length:p}, (_,j) => X.reduce((a,r) => a+r[j], 0)/n);
  const sd = Array.from({length:p}, (_,j) => Math.sqrt(X.reduce((a,r) => a+(r[j]-mu[j])**2, 0)/n) || 1);
  const Z = X.map(r => [1, ...r.map((v,j) => (v-mu[j])/sd[j])]);
  const A = Array.from({length:p+1}, (_,i) => Array.from({length:p+1}, (_,j) => Z.reduce((a,r) => a+r[i]*r[j], 0) + (i===j && i>0 ? lam : 0)));
  const b = Array.from({length:p+1}, (_,i) => Z.reduce((a,r,k) => a+r[i]*tr[k][yk], 0));
  const w = solve(A, b); return w ? {w, mu, sd, f, q} : null;
}

function pred(m, row) {
  const x = vec(row, m.f, m.q);
  return m.w[0] + x.reduce((a,v,j) => a + m.w[j+1]*(v-m.mu[j])/m.sd[j], 0);
}

function cvRes(tr, f, q, ys) {
  const g = tr.map((r,i) => r.CoilID || 'i'+i), u = [...new Set(g)], K = Math.min(5, u.length);
  const res = Array(tr.length);
  for (let k = 0; k < K; k++) {
    const val = new Set(u.filter((_,i) => i % K === k));
    const tIn = tr.filter((_,i) => !val.has(g[i]));
    const ms = ys.map(y => fitModel(tIn, f, q, y)); if (ms.some(m => !m)) return null;
    tr.forEach((r,i) => { if (val.has(g[i])) res[i] = ys.map((y,t) => r[y] - pred(ms[t], r)); });
  }
  return res;
}

function cvScore(res, tr, ys) {
  return ys.reduce((s,y,t) => {
    const m = tr.reduce((a,r) => a+r[y], 0)/tr.length;
    const v = tr.reduce((a,r) => a+(r[y]-m)**2, 0)/tr.length || 1;
    return s + res.reduce((a,r) => a+r[t]**2, 0)/res.length/v;
  }, 0);
}

function chol(S) {
  const n = S.length, L = Array.from({length:n}, () => Array(n).fill(0));
  for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
    let s = S[i][j]; for (let k = 0; k < j; k++) s -= L[i][k]*L[j][k];
    L[i][j] = i === j ? Math.sqrt(Math.max(s, 1e-6)) : s/L[j][j];
  }
  return L;
}

function makeDraws(L, N = 2500) {
  let s = 1234567; const rnd = () => (s = (s*16807)%2147483647)/2147483647;
  const g = () => Math.sqrt(-2*Math.log(rnd()))*Math.cos(2*Math.PI*rnd());
  const d = L.length;
  return Array.from({length:N}, () => { const z = Array.from({length:d}, g); return L.map(r => r.reduce((a,v,j) => a+v*z[j], 0)); });
}

function simulate() {
  const out = $('simOut'); out.style.display = 'block'; $('simTab').innerHTML = '';
  if (!data.length) { out.innerText = 'Please run the analysis first.'; return; }
  const isHSM = C.route === 'HSM';
  const v = id => parseFloat($(id).value);
  const inp = {Th:v('s_Th'), CR:v('s_CR'), CT:v('s_CT'), V_rot:v('s_Vrot'), V_galva:v('s_V'), C:v('s_C'), Mn:v('s_Mn'), Nb:v('s_Nb'), Ti:v('s_Ti'), N:v('s_N'), Pos:v('s_Pos'), TF7:v('s_TF7')};
  if (isNaN(inp.Th) || isNaN(inp.CT) || (!isHSM && isNaN(inp.CR))) {
    out.innerText = isHSM ? 'Please enter Th and CT.' : 'Please enter Th, %CR and CT.'; return;
  }
  inp.Nb_eff = ![inp.Nb,inp.N,inp.Ti].some(isNaN) ? inp.Nb - Math.max(0, 6.64*(inp.N - 0.292*inp.Ti)) : NaN;
  inp.C_eq = ![inp.C,inp.Mn].some(isNaN) ? inp.C + inp.Mn/6 : NaN;
  inp.Potentiel_HSM = !isNaN(inp.V_rot) && inp.CT > 400 ? inp.V_rot/(inp.CT-400) : NaN;

  const reg = regime(inp.Th);
  let pool = data.filter(d => d.Regime === reg), note = '';
  if (pool.length < 40) { pool = data; note = `⚠️ Regime ${reg}: < 40 tests, calibrated across all thicknesses.\n`; }
  const cov = c => pool.filter(d => !isNaN(d[c])).length / pool.length;

  const candFeats = isHSM
    ? ['CT','V_rot','Th','Nb_eff','C_eq','Pos','TF7']
    : ['T_recuit','V_galva','CT','V_rot','CR','Th','Nb_eff','C_eq','Pos','TF7'];
  const f = candFeats.filter(c => (!isHSM && (c === 'T_recuit' || c === 'V_galva')) ? cov(c) >= .8 : !isNaN(inp[c]) && cov(c) >= .8);

  let tr = pool.filter(d => f.every(c => !isNaN(d[c])));
  let useA = C.hasA;
  if (useA) { const t2 = tr.filter(d => !isNaN(d.A)); if (t2.length >= 30 && t2.length >= .5*tr.length) tr = t2; else useA = false; }
  if (tr.length < 30) { out.innerText = 'Insufficient data (< 30 complete tests).'; return; }
  const ys = useA ? ['Rp','Rm','A'] : ['Rp','Rm'];

  const R0 = cvRes(tr, f, false, ys), R1 = cvRes(tr, f, true, ys);
  if (!R0 || !R1) { out.innerText = 'Calibration failed (collinearity).'; return; }
  const q = cvScore(R1, tr, ys) < cvScore(R0, tr, ys) - 0.01, R = q ? R1 : R0;
  const ms = ys.map(y => fitModel(tr, f, q, y));
  const sdv = ys.map((_,t) => Math.sqrt(R.reduce((a,r) => a+r[t]**2, 0)/R.length));
  const r2 = ys.map((y,t) => { const m = tr.reduce((a,r) => a+r[y], 0)/tr.length; return 1 - R.reduce((a,r) => a+r[t]**2, 0)/tr.reduce((a,r) => a+(r[y]-m)**2, 0); });
  const S = ys.map((_,i) => ys.map((_,j) => R.reduce((a,r) => a+r[i]*r[j], 0)/R.length));
  const E = makeDraws(chol(S));
  const corr = S[0][1]/Math.sqrt(S[0][0]*S[1][1]);

  const pOk = (p) => { let c = 0; for (const e of E) if (p[0]+e[0] >= C.rp && p[1]+e[1] <= C.rm && (!useA || p[2]+e[2] > C.a)) c++; return c/E.length; };
  const predAll = row => ms.map(m => pred(m, row));

  let t = note + `Route: ${isHSM ? 'Hot Rolling only' : 'Annealing / Galva'} | Grade: ${C.grade} | Regime ${reg} | dir. ${C.dir} | ${tr.length} tests | ${q ? 'quadratic' : 'linear'} model\n`;
  t += `Features: ${f.join(', ')}\n`;
  t += `Out-of-sample R² (coil-grouped CV): ` + ys.map((y,i) => `${y} ${r2[i].toFixed(2)} (±${sdv[i].toFixed(1)})`).join(' | ') + ` | Rp-Rm residual corr. ${corr.toFixed(2)}\n${'-'.repeat(60)}\n`;

  if (isHSM) {
    const p = predAll(inp), po = pOk(p);
    t += `HOT-ROLLED PREDICTION (CT = ${inp.CT} °C):\n`;
    t += `Predicted: Rp ${p[0].toFixed(0)} MPa | Rm ${p[1].toFixed(0)} MPa${useA ? ' | A ' + p[2].toFixed(1) + ' %' : ''}\n`;
    t += `Joint compliance probability: ${(po*100).toFixed(0)} %\n`;

    const cts = [-20, -10, 0, 10, 20].map(d => inp.CT + d);
    let h = `<b>Sensitivity to Coiling Temperature CT</b><table><tr style="background:#f1f5f9"><th>Metric \\ CT</th>${cts.map(x => `<th>${x} °C</th>`).join('')}</tr><tr><td><b>Prediction</b></td>`;
    cts.forEach(ct => {
      const pc = predAll({...inp, CT:ct}), poc = pOk(pc);
      const bg = poc >= .8 ? '#dcfce7' : poc >= .5 ? '#fef9c3' : '#fee2e2';
      h += `<td style="background:${bg};${ct === inp.CT ? 'border:3px solid #16a34a' : ''}"><b>Rp ${pc[0].toFixed(0)}</b> | Rm ${pc[1].toFixed(0)}${useA ? ' | A ' + pc[2].toFixed(1) : ''}<br><small>Conf. ${(poc*100).toFixed(0)}%</small></td>`;
    });
    $('simTab').innerHTML = h + `</tr></table><div style="font-size:.78em;color:#64748b;margin-top:4px">Green ≥ 80% | Yellow 50–80% | Red &lt; 50% | thick border: entered CT</div>`;
  } else {
    const tv = tr.map(d => d.T_recuit), tMin = Math.floor(quant(tv, .05)), tMax = Math.ceil(quant(tv, .95));
    const useV = f.includes('V_galva'), vFixed = useV && !isNaN(inp.V_galva);
    let vGrid = [NaN], vMin = NaN, vMax = NaN;
    if (vFixed) vGrid = [inp.V_galva];
    else if (useV) { const vs = tr.map(d => d.V_galva); vMin = quant(vs, .05); vMax = quant(vs, .95); vGrid = Array.from({length:15}, (_,i) => vMin + (vMax-vMin)*i/14); }

    const grid = [];
    for (let temp = tMin; temp <= tMax; temp++) for (const vg of vGrid) {
      const p = predAll({...inp, T_recuit:temp, V_galva:vg});
      grid.push({t:temp, v:vg, p, pOk:pOk(p)});
    }
    const maxP = Math.max(...grid.map(g => g.pOk)), plat = grid.filter(g => g.pOk >= maxP - .01);
    const tMed = quant(plat.map(g => g.t), .5), vMed = vGrid.length > 1 ? quant(plat.map(g => g.v), .5) : NaN;
    const dist = g => Math.abs(g.t - tMed) + (vGrid.length > 1 ? Math.abs(g.v - vMed)/(vMax - vMin)*(tMax - tMin) : 0);
    const best = plat.reduce((a,b) => dist(b) < dist(a) ? b : a);
    const ok95 = grid.filter(g => g.pOk >= .95);

    t += `Explored T range: ${tMin}–${tMax} °C${vGrid.length > 1 ? ` | speed range: ${vMin.toFixed(0)}–${vMax.toFixed(0)}` : ''}\n`;
    t += `SETPOINT T_anneal = ${best.t} °C${vGrid.length > 1 ? ' | RECOMMENDED SPEED = ' + best.v.toFixed(0) : vFixed ? ' (fixed speed ' + inp.V_galva + ')' : ''}\n`;
    t += `Predicted: Rp ${best.p[0].toFixed(0)} | Rm ${best.p[1].toFixed(0)}${useA ? ' | A ' + best.p[2].toFixed(1) + ' %' : ''}\n`;
    t += `Joint compliance probability: ${(best.pOk*100).toFixed(0)} %\n`;
    if (ok95.length) t += `T range at ≥ 95%: ${Math.min(...ok95.map(g => g.t))}–${Math.max(...ok95.map(g => g.t))} °C\n`;
    else t += `⚠️ No setpoint reaches 95% compliance: coil at risk.\n`;
    if (best.t === tMin || best.t === tMax || (vGrid.length > 1 && (best.v === vMin || best.v === vMax))) t += `⚠️ Optimum at historical boundary: validate on line.\n`;

    const ts = Array.from({length:5}, (_,i) => Math.max(tMin, Math.min(tMax-8, best.t-4)) + 2*i).filter(x => x <= tMax);
    const sp = vGrid.length > 1 ? [...new Set([Math.round(vMin), Math.round(best.v), Math.round(vMax)])].sort((a,b) => a-b) : [vGrid[0]];
    let h = `<b>Sensitivity Grid</b><table><tr style="background:#f1f5f9"><th>Speed \\ T</th>${ts.map(x => `<th>${x} °C</th>`).join('')}</tr>`;
    sp.forEach(vg => {
      h += `<tr><td><b>${isNaN(vg) ? 'Standard' : 'V = ' + vg}</b></td>`;
      ts.forEach(x => {
        const p = predAll({...inp, T_recuit:x, V_galva:vg}), po = pOk(p);
        const bg = po >= .8 ? '#dcfce7' : po >= .5 ? '#fef9c3' : '#fee2e2';
        const isB = x === best.t && (isNaN(vg) || Math.abs(vg - best.v) < 1);
        h += `<td style="background:${bg};${isB ? 'border:3px solid #16a34a' : ''}"><b>Rp ${p[0].toFixed(0)}</b> | Rm ${p[1].toFixed(0)}${useA ? ' | A ' + p[2].toFixed(1) : ''}<br><small>Conf. ${(po*100).toFixed(0)}%</small></td>`;
      });
      h += '</tr>';
    });

    $('simTab').innerHTML = h + `</table><div style="font-size:.78em;color:#64748b;margin-top:4px">Green ≥ 80% | Yellow 50–80% | Red &lt; 50% | thick border: recommended setpoint</div>`;
  }
  if (r2.some(x => x < .3)) t += `⚠️ R² < 0.3: indicative prediction only.\n`;
  if (!isNaN(inp.Potentiel_HSM)) {
    const hv = pool.map(d => d.Potentiel_HSM).filter(x => !isNaN(x));
    if (hv.length >= 20) {
      const lo = isNaN(C.hlo) ? quant(hv, .2) : C.hlo, hi = isNaN(C.hhi) ? quant(hv, .8) : C.hhi;
      const pct = Math.round(hv.filter(x => x <= inp.Potentiel_HSM).length / hv.length * 100);
      t += `ℹ️ HSM Potential = ${inp.Potentiel_HSM.toFixed(3)} (percentile ${pct} of regime ${reg}; thresholds ${lo.toFixed(2)} / ${hi.toFixed(2)}${isNaN(C.hlo) && isNaN(C.hhi) ? ' auto' : ''}): `;
      if (C.grade === 'HSLA') {
        if (inp.Potentiel_HSM >= hi) t += `high → strong Nb precipitation hardening expected; watch for high Rm at low T_anneal or high speed.\n`;
        else if (inp.Potentiel_HSM <= lo) t += `low → advanced precipitation during coiling, higher risk of low Rp; favor lower T_anneal / higher speed within window.\n`;
        else t += `intermediate.\n`;
      } else if (C.grade === 'CMN') {
        if (inp.Potentiel_HSM >= hi) t += `high → fast ROT cooling / low CT: ferrite grain refinement (higher Rp).\n`;
        else if (inp.Potentiel_HSM <= lo) t += `low → high CT / slow cooling: ferrite grain coarsening (lower Rp).\n`;
        else t += `intermediate.\n`;
      } else {
        if (inp.Potentiel_HSM >= hi) t += `high → higher bainitic/martensitic fraction upon coiling.\n`;
        else if (inp.Potentiel_HSM <= lo) t += `low → more ferritic microstructure upon coiling.\n`;
        else t += `intermediate.\n`;
      }
    } else t += `ℹ️ HSM Potential = ${inp.Potentiel_HSM.toFixed(3)} (insufficient historical data to benchmark).\n`;
  }
  const outside = (isHSM ? ['Th','CT','V_rot','Nb_eff','C_eq'] : ['Th','CR','CT','V_rot','Nb_eff','C_eq']).filter(c => !isNaN(inp[c])).filter(c => {
    const a = pool.map(d => d[c]).filter(x => !isNaN(x)); return a.length > 20 && (inp[c] < quant(a, .025) || inp[c] > quant(a, .975));
  });
  if (outside.length) t += `⚠️ Outside historical range (2.5–97.5%): ${outside.join(', ')} → extrapolation.\n`;
  t += `ℹ️ Model also reflects past operator practices (correlation, not causality): validate on line.\n`;
  out.innerText = t;
}

}
toggleRoute();
</script>
</body>
